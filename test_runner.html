<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>กฐินคุณยายฯ — Automated Test Runner & Visual QA</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FAF8F5;
      color: #181F26;
      padding: 30px;
      line-height: 1.6;
    }
    .test-card {
      background: #fff;
      border: 1px solid #E8E3DC;
      border-radius: 16px;
      padding: 24px;
      max-width: 900px;
      margin: 0 auto 30px;
      box-shadow: 0 4px 20px rgba(12, 74, 69, 0.06);
    }
    h1 {
      color: #0C4A45;
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-pass {
      background: #DCFCE7;
      color: #166534;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .badge-fail {
      background: #FEE2E2;
      color: #991B1B;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .test-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #F1ECE6;
    }
    .test-item:last-child {
      border-bottom: none;
    }
    .test-name {
      font-weight: 500;
    }
    .progress-bar {
      height: 10px;
      background: #E8E3DC;
      border-radius: 5px;
      overflow: hidden;
      margin: 16px 0;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0C4A45, #14B8A6);
      width: 0%;
      transition: width 0.3s ease;
    }
    iframe {
      width: 100%;
      height: 480px;
      border: 1px solid #E8E3DC;
      border-radius: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="test-card">
    <h1><img src="assets/lotus-icon.png" style="width:32px; height:32px; vertical-align:middle; margin-right:8px;" alt=""> กฐินคุณยายฯ — Visual QA & Automated Test Suite</h1>
    <p>ทดสอบการทำงานของระบบทุก Phase ตามข้อกำหนดอัตโนมัติ</p>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div style="font-weight:600; color:#0C4A45;" id="summaryTxt">กำลังทดสอบ...</div>

    <div id="testList" style="margin-top:20px;"></div>
  </div>

  <div class="test-card">
    <h2>📱 ทดสอบ Responsive Viewport (Desktop 1440/1280, Tablet 1024/768, Mobile 430/390/375)</h2>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
      <button onclick="resizeFrame(1440)">Desktop 1440px</button>
      <button onclick="resizeFrame(1280)">Desktop 1280px</button>
      <button onclick="resizeFrame(1024)">Tablet 1024px</button>
      <button onclick="resizeFrame(768)">Tablet 768px</button>
      <button onclick="resizeFrame(430)">iPhone 15 Pro Max (430px)</button>
      <button onclick="resizeFrame(390)">iPhone 14/15 (390px)</button>
      <button onclick="resizeFrame(375)">iPhone SE (375px)</button>
    </div>
    <iframe id="testFrame" src="index.html"></iframe>
  </div>

  <script src="shared/storage.js"></script>
  <script src="shared/drive-sync.js"></script>
  <script src="config.js"></script>

  <script>
    function resizeFrame(w) {
      const f = document.getElementById('testFrame');
      f.style.width = w + 'px';
      f.style.maxWidth = '100%';
    }

    const tests = [
      { name: '1. FrameStore โหลดข้อมูลกรอบและมีหมวดหมู่ครบ (ทั้งหมด, กฐิน, มุทิตาสักการะ, งานบุญ, พิธี, อื่น ๆ)', test: async () => {
        const frames = await FrameStore.getAll();
        const cats = await FrameStore.getCategories();
        return frames.length >= 5 && cats.includes('กฐิน') && cats.includes('มุทิตาสักการะ') && cats.includes('งานบุญ') && cats.includes('พิธี');
      }},
      { name: '2. Frame Metadata มี photoArea ครบ (x, y, width, height, borderRadius)', test: async () => {
        const frames = await FrameStore.getActive();
        return frames.every(f => f.photoArea && typeof f.photoArea.x === 'number' && typeof f.photoArea.width === 'number');
      }},
      { name: '3. QuoteStore คลังคำคมมี 7 หมวดหมู่ตาม Phase 14', test: async () => {
        const cats = await QuoteStore.getCategories();
        return cats.length === 7 && cats.includes('🙏 อนุโมทนา') && cats.includes('🌸 คำอวยพร') && cats.includes('✨ ข้อคิด');
      }},
      { name: '4. Quote Placements รองรับ home, editor, final, activity, share', test: async () => {
        const homeQ = await QuoteStore.getByPlacement('home');
        const actQ = await QuoteStore.getByPlacement('activity');
        return homeQ.length > 0 && actQ.length > 0;
      }},
      { name: '5. ActivityStore ระบบกิจกรรมชุมชนบันทึกการส่งภาพได้', test: async () => {
        const dummy = await ActivityStore.addSubmission({
          dataUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==',
          caption: 'ทดสอบส่งภาพกิจกรรม',
          eventName: 'กฐิน ๑๑๘ ปี'
        });
        return dummy && dummy.id && dummy.eventName === 'กฐิน ๑๑๘ ปี';
      }},
      { name: '6. Reactions รองรับ ❤️ ชอบ, 🙏 อนุโมทนา, 👍 ร่วมยินดี และอัปเดตจำนวนทันที', test: async () => {
        const all = await ActivityStore.getAll();
        if (all.length === 0) return false;
        const target = all[0];
        const res = await ActivityStore.react(target.id, 'sadhu');
        return res && typeof res.sadhu === 'number' && res.sadhu >= 1;
      }},
      { name: '7. Activity Statistics แสดงตัวเลขจริงจากระบบ (ไม่มีการใช้ตัวเลขปลอม)', test: async () => {
        const stats = await ActivityStore.getStats();
        return typeof stats.totalCreations === 'number' && typeof stats.totalParticipants === 'number' && typeof stats.totalReactions === 'number';
      }},
      { name: '8. DriveSync รักษาโครงสร้าง Google Drive และไม่เปิดเผย Secret', test: async () => {
        return typeof DriveSync.isConfigured === 'function' && typeof DriveSync.uploadActivity === 'function' && typeof DriveSync.uploadFinished === 'function';
      }},
      { name: '9. Moderation สามารถซ่อน/ลบและรายงานเนื้อหาได้', test: async () => {
        const all = await ActivityStore.getAll();
        if (all.length === 0) return false;
        const id = all[0].id;
        await ActivityStore.report(id, 'ทดสอบรายงาน');
        await ActivityStore.setStatus(id, 'HIDDEN');
        const updated = (await ActivityStore.getAll()).find(a => a.id === id);
        return updated.status === 'HIDDEN' && updated.reported === true;
      }},
      { name: '10. FrameStore CRUD: เพิ่ม, ทำซ้ำ, สลับลำดับ, ลบ', test: async () => {
        const copy = await FrameStore.duplicate('kathin-118');
        const hasCopy = (await FrameStore.getAll()).some(f => f.id === copy.id);
        await FrameStore.remove(copy.id);
        const removed = !(await FrameStore.getAll()).some(f => f.id === copy.id);
        return hasCopy && removed;
      }},
      { name: '11. Storage v3: อพยพข้อมูล pfs_frames_v2 -> pfs_frames_v3 และสำรอง pfs_frames_v2_backup อัตโนมัติ', test: async () => {
        const savedV3 = localStorage.getItem('pfs_frames_v3');
        const savedV2 = localStorage.getItem('pfs_frames_v2');
        const savedBackup = localStorage.getItem('pfs_frames_v2_backup');
        try {
          localStorage.removeItem('pfs_frames_v3');
          localStorage.removeItem('pfs_frames_v2_backup');
          const legacyFrames = [{
            id: 'legacy-v2-frame',
            name: 'กรอบเดิม v2',
            category: 'กฐิน',
            filename: 'assets/frames/kathin-118.png',
            status: 'ACTIVE',
            photoArea: { x: 0, y: 0, width: 1024, height: 1024, borderRadius: 0 }
          }];
          const rawV2 = JSON.stringify(legacyFrames);
          localStorage.setItem('pfs_frames_v2', rawV2);
          FrameStore.invalidateCache();

          const mig = FrameStore.migrateFromV2();
          const all = await FrameStore.getAll();
          const v2StillPresent = localStorage.getItem('pfs_frames_v2') === rawV2;
          const backupCreated = localStorage.getItem('pfs_frames_v2_backup') === rawV2;
          const v3HasLegacy = all.some(f => f.id === 'legacy-v2-frame');
          return mig.migrated === true && v2StillPresent && backupCreated && v3HasLegacy;
        } finally {
          if (savedV3 !== null) localStorage.setItem('pfs_frames_v3', savedV3); else localStorage.removeItem('pfs_frames_v3');
          if (savedV2 !== null) localStorage.setItem('pfs_frames_v2', savedV2); else localStorage.removeItem('pfs_frames_v2');
          if (savedBackup !== null) localStorage.setItem('pfs_frames_v2_backup', savedBackup); else localStorage.removeItem('pfs_frames_v2_backup');
          FrameStore.invalidateCache();
        }
      }},
      { name: '12. Storage v3: ข้อมูล pfs_frames_v3 ที่ถูกต้องไม่ถูกเขียนทับด้วย pfs_frames_v2', test: async () => {
        const savedV3 = localStorage.getItem('pfs_frames_v3');
        const savedV2 = localStorage.getItem('pfs_frames_v2');
        try {
          await FrameStore.resetToSeed();
          localStorage.setItem('pfs_frames_v2', JSON.stringify([{
            id: 'stale-v2-only',
            name: 'Stale v2',
            category: 'กฐิน',
            filename: 'assets/frames/kathin-118.png'
          }]));
          const mig = FrameStore.migrateFromV2();
          const all = await FrameStore.getAll();
          return mig.migrated === false && mig.status === 'preserved_v3' && !all.some(f => f.id === 'stale-v2-only');
        } finally {
          if (savedV3 !== null) localStorage.setItem('pfs_frames_v3', savedV3);
          if (savedV2 !== null) localStorage.setItem('pfs_frames_v2', savedV2); else localStorage.removeItem('pfs_frames_v2');
          FrameStore.invalidateCache();
        }
      }},
      { name: '13. Cross-Tab Sync: รับฟัง pfs_frames_v3 และเมินเฉยต่อคีย์อื่นที่ไม่เกี่ยวข้อง / ป้องกันการผูกซ้ำ', test: async () => {
        let frameEvents = 0;
        const onFrames = () => { frameEvents++; };
        window.addEventListener('pfs:frames_updated', onFrames);
        try {
          const secondBind = window.bindCrossTabSync();
          window.dispatchEvent(new StorageEvent('storage', { key: 'unrelated_app_key', newValue: '123' }));
          const unrelatedIgnored = frameEvents === 0;
          window.dispatchEvent(new StorageEvent('storage', { key: 'pfs_frames_v2', newValue: '[]' }));
          const v2IgnoredWhenV3Valid = frameEvents === 0;
          window.dispatchEvent(new StorageEvent('storage', { key: 'pfs_frames_v3', newValue: localStorage.getItem('pfs_frames_v3') }));
          return secondBind === false && unrelatedIgnored && v2IgnoredWhenV3Valid && frameEvents === 1;
        } finally {
          window.removeEventListener('pfs:frames_updated', onFrames);
        }
      }},
      { name: '14. Backup & Restore v3: Export ข้อมูล v3.0 และกู้คืนทั้งไฟล์ v3.0 และ Legacy v2.0 ได้ถูกต้อง', test: async () => {
        const exported = await StorageBackup.exportBackup();
        if (exported.version !== '3.0' || !Array.isArray(exported.frames)) return false;

        const legacyBackup = {
          version: '2.0',
          frames: exported.frames.map((f, idx) => idx === 0 ? { ...f, name: 'ชื่อกรอบทดสอบกู้คืน' } : f),
          quotes: exported.quotes,
          activities: exported.activities
        };
        await StorageBackup.restoreBackup(JSON.stringify(legacyBackup));
        FrameStore.invalidateCache();
        const reloaded = await FrameStore.getAll();
        const restoredOk = reloaded[0].name === 'ชื่อกรอบทดสอบกู้คืน';

        // Restore original v3 backup back
        await StorageBackup.restoreBackup(JSON.stringify(exported));
        return restoredOk;
      }},
      { name: '15. Backup Validation & Atomic Rollback: ปฏิเสธไฟล์เสียโดยไม่ทำลายข้อมูลเดิม', test: async () => {
        const beforeFrames = await FrameStore.getAll();
        let rejected = false;
        try {
          await StorageBackup.restoreBackup('{"version":"3.0","frames":[{"invalid":true}]}');
        } catch (err) {
          rejected = true;
        }
        const afterFrames = await FrameStore.getAll();
        return rejected && JSON.stringify(beforeFrames) === JSON.stringify(afterFrames);
      }},
      { name: '16. Reset Defaults: รีเซ็ต pfs_frames_v3 กลับค่าเริ่มต้น คงคีย์อื่นไว้ และคงสภาพหลังโหลดซ้ำ', test: async () => {
        localStorage.setItem('pfs_custom_unrelated_test_key', 'keep_me');
        try {
          await FrameStore.duplicate('kathin-118');
          await StorageBackup.resetAllDefaults();
          FrameStore.invalidateCache();
          QuoteStore.invalidateCache();
          ActivityStore.invalidateCache();
          const framesAfterReload = await FrameStore.getAll();
          const activitiesAfterReload = await ActivityStore.getAll();
          const unrelatedKept = localStorage.getItem('pfs_custom_unrelated_test_key') === 'keep_me';
          return framesAfterReload.length >= 5 &&
            !framesAfterReload.some(f => f.name.includes('(สำเนา)')) &&
            activitiesAfterReload.length === 0 &&
            unrelatedKept;
        } finally {
          localStorage.removeItem('pfs_custom_unrelated_test_key');
        }
      }}
    ];

    async function runAll() {
      const container = document.getElementById('testList');
      let passed = 0;
      for (let i = 0; i < tests.length; i++) {
        const t = tests[i];
        let ok = false;
        try {
          ok = await t.test();
        } catch(e) {
          console.error(e);
          ok = false;
        }
        if (ok) passed++;

        const item = document.createElement('div');
        item.className = 'test-item';
        item.innerHTML = `
          <span class="test-name">${t.name}</span>
          <span class="${ok ? 'badge-pass' : 'badge-fail'}">${ok ? '✓ ผ่าน (PASS)' : '✗ ไม่ผ่าน (FAIL)'}</span>
        `;
        container.appendChild(item);

        const pct = Math.round(((i + 1) / tests.length) * 100);
        document.getElementById('progressFill').style.width = pct + '%';
      }

      const passPct = tests.length > 0 ? Math.round((passed / tests.length) * 100) : 0;
      const summaryEl = document.getElementById('summaryTxt');
      summaryEl.style.color = passed === tests.length ? '#0C4A45' : '#991B1B';
      summaryEl.textContent = `ผลการทดสอบ: ผ่านทั้งหมด ${passed} / ${tests.length} การทดสอบ (${passPct}% ${passed === tests.length ? 'SUCCESS' : 'PASSED'})`;
    }

    setTimeout(runAll, 300);
  </script>
</body>
</html>
